name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "packages/windows-installer/MeshJoin.ps1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web/ from packages/
        run: |
          cp packages/agent-daemon/src/index.ts web/agent-daemon.ts
          cp packages/ctl/src/index.ts web/ctl.ts
          # Serve agent artifacts from Pages (no R2/CF token needed):
          #   dureclaw.baryon.ai/oah-agent.js  → bundled daemon (brain-capable)
          #   dureclaw.baryon.ai/agent.py      → RPi/Pi Zero python agent
          cp scripts/rpi_agent.py web/agent.py
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          (cd packages/agent-daemon && bun install --frozen-lockfile 2>/dev/null || bun install)
          # node-entry(셰뱅 없음) + --target=node → ws 를 번들에 포함, --format=cjs → 확장자가 .js 라도
          # Node 18(RPi apt) 이 바로 실행. 같은 파일을 Bun(Windows agent.ps1)도 실행한다.
          bun build packages/agent-daemon/src/node-entry.ts --target=node --format=cjs --outfile=web/oah-agent.js

      - name: Publish scripts as short URLs
        run: |
          # dureclaw.baryon.ai/install → install.sh (올인원 — server+mcp+tailscale)
          cp scripts/install.sh      web/install
          # dureclaw.baryon.ai/server  → setup-server.sh
          cp scripts/setup-server.sh web/server
          # dureclaw.baryon.ai/agent   → setup-agent.sh
          cp scripts/setup-agent.sh  web/agent
          # dureclaw.baryon.ai/mcp     → setup-mcp.sh
          cp scripts/setup-mcp.sh    web/mcp
          # dureclaw.baryon.ai/mesh      → mesh.sh (자체 사설망 Headscale 도구)
          cp scripts/mesh.sh          web/mesh
          # dureclaw.baryon.ai/mesh-join.ps1 → Windows 노드 자체 망 합류 (setup-agent.ps1 의 JOIN 이 사용)
          cp packages/windows-installer/MeshJoin.ps1 web/mesh-join.ps1
          # dureclaw.baryon.ai/agent.ps1 → setup-agent.ps1 (Windows PowerShell)
          cp scripts/setup-agent.ps1 web/agent.ps1
          # dureclaw.baryon.ai/agent.bat → setup-agent.bat (Windows CMD)
          cp scripts/setup-agent.bat  web/agent.bat

      - name: Upload build artifacts to R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest --silent
          # open-agent-harness.baryon.ai/agent.py → rpi_agent.py (RPi Zero W armv6l)
          wrangler r2 object put open-agent-harness/agent.py \
            --file scripts/rpi_agent.py \
            --content-type "text/x-python" \
            --remote

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
