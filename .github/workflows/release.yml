name: Release — DureClaw Server Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: true

permissions:
  contents: write   # softprops/action-gh-release needs this to create the Release

jobs:
  build-server:
    name: Build server ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (M-series)
          - os: darwin
            arch: arm64
            runner: macos-14
          # Linux x86_64
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          # Linux arm64
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Build release
        working-directory: packages/phoenix-server
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release harness_server --overwrite

      - name: Package tarball
        working-directory: packages/phoenix-server
        run: |
          TARBALL="oah-server-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$TARBALL" \
            -C _build/prod/rel \
            harness_server
          echo "TARBALL_PATH=packages/phoenix-server/$TARBALL" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oah-server-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.TARBALL_PATH }}
          retention-days: 7

  build-agent:
    name: Build agent ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          # Intel Mac (x86_64) — arm64 러너에서 크로스컴파일
          - os: darwin
            arch: x64
            runner: macos-14
            bun_target: bun-darwin-x64
          - os: linux
            arch: x64
            runner: ubuntu-22.04
            bun_target: bun-linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            bun_target: bun-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/agent-daemon
        run: bun install

      - name: Build binary
        working-directory: packages/agent-daemon
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.bun_target }} \
            --outfile=oah-agent-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oah-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/agent-daemon/oah-agent-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # Windows: 에이전트 exe + 설치 프로그램(DureClaw-Agent-Setup.exe, Inno Setup)
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build agent exe
        working-directory: packages/agent-daemon
        run: |
          bun install
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile=../windows-installer/oah-agent.exe
          Copy-Item ../windows-installer/oah-agent.exe ../windows-installer/oah-agent-windows-x64.exe

      - name: Build launcher (DureClaw.exe)
        working-directory: packages/windows-installer
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /win32icon:dureclaw.ico /out:DureClaw.exe Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }

      - name: Build installer
        working-directory: packages/windows-installer
        run: |
          $tag = "${{ github.ref_name || inputs.tag }}"
          $ver = $tag -replace '^v', ''
          if ($ver -notmatch '^\d') { $ver = "0.0.0-dev" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" dureclaw-agent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # artifact 를 평평하게 — Output\ 하위 폴더째 올라가면 release 의 dist/*.exe 패턴에 안 걸린다
          Copy-Item Output\DureClaw-Agent-Setup.exe .
          Get-ChildItem *.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dureclaw-windows
          path: |
            packages/windows-installer/DureClaw-Agent-Setup.exe
            packages/windows-installer/oah-agent-windows-x64.exe
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-server, build-agent, build-windows-installer]
    runs-on: ubuntu-latest
    if: always()   # build 일부 실패해도 실행

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/ || echo "(no artifacts)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: DureClaw ${{ github.ref_name || inputs.tag }}
          body: |
            ## DureClaw Server — 사전빌드 바이너리

            Elixir/Erlang 설치 없이 바로 실행 가능합니다.

            ### 자동 설치 (권장)
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/DureClaw/dureclaw/main/scripts/setup-server.sh)
            ```

            ### 수동 설치
            OS/아키텍처에 맞는 파일을 다운로드 후:
            ```bash
            tar -xzf oah-server-darwin-arm64.tar.gz
            ./harness_server/bin/harness_server start
            ```

            | 파일 | 플랫폼 |
            |------|--------|
            | `oah-server-darwin-arm64.tar.gz` | macOS Apple Silicon (M1/M2/M3/M4) |
            | `oah-server-linux-x86_64.tar.gz` | Linux x86_64 |
            | `oah-server-linux-arm64.tar.gz` | Linux arm64 (Raspberry Pi 4/5 64bit) |

            > Intel Mac은 사전빌드 없음 — `bash <(curl ...)` 한 줄 실행 시 자동으로 소스 빌드로 폴백됩니다.

            ### Windows — 설치 프로그램 (터미널 불필요)

            **`DureClaw-Agent-Setup.exe`** 를 받아 실행 → 서버 주소(비우면 자동 탐색)·역할 입력 → 끝.
            관리자 권한 없이 설치되고, 로그인 시 자동 연결되며 트레이 아이콘에서 상태·로그·설정을 관리합니다.

            무인 설치: `DureClaw-Agent-Setup.exe /VERYSILENT /SERVER=ws://100.x.x.x:4000 /ROLE=builder`

            ### 워커 에이전트 바이너리

            | 파일 | 플랫폼 |
            |------|--------|
            | `oah-agent-darwin-arm64` | macOS Apple Silicon |
            | `oah-agent-linux-x64` | Linux x86_64 |
            | `oah-agent-linux-arm64` | Linux arm64 |
            | `oah-agent-windows-x64.exe` | Windows x64 (설치 프로그램 없이 단독 실행) |
          files: |
            dist/*.tar.gz
            dist/oah-agent-*
            dist/**/DureClaw-Agent-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
